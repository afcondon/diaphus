[package]
name = "diaphus"
version = "0.1.1"
edition = "2024"

[dependencies]
rusty_link = "0.4"
rosc = "0.10"
# /link/anchor: the value, its validity rule and its 56 bytes, shared with
# es9-daemon and Itajara and held to Binnacle's conformance vectors
# (binnacle/conformance/LINK-ANCHOR.md). Taken from git at a pinned commit so
# that this repository builds from a lone clone; Cargo finds the crate inside
# the Binnacle repository by its package name.
link-anchor = { git = "https://github.com/afcondon/binnacle", rev = "ac0481ed6745e1813c5e402d5b75fbd1e588ede1" }
coremidi = "0.8"
mach2 = "0.4"
core-foundation-sys = "0.8"

[dev-dependencies]
# For the conformance replays only: the vector files, and reading them.
link-anchor = { git = "https://github.com/afcondon/binnacle", rev = "ac0481ed6745e1813c5e402d5b75fbd1e588ede1", features = ["vectors"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
